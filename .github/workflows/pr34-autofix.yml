name: PR34 Autofix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.number == 34 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Remove explicit-any debt with narrow structural types
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/lib/admin-products.functions.ts")
          s = p.read_text()
          marker = 'import { assertAdmin } from "@/lib/admin-authorization.server";\n'
          addition = '''\n\ntype ProductWriteRpcClient = {\n  rpc: (\n    fn: "admin_upsert_product_v1" | "admin_upsert_product_variant_v1",\n    args: Record<string, unknown>,\n  ) => PromiseLike<{ data: string | null; error: { message?: string } | null }>;\n};\n'''
          if "type ProductWriteRpcClient" not in s:
              s = s.replace(marker, marker + addition)
          s = s.replace("(context.supabase as any).rpc", "(context.supabase as unknown as ProductWriteRpcClient).rpc")
          p.write_text(s)

          p = Path("src/lib/admin-products-import.functions.ts")
          s = p.read_text()
          marker = 'import { assertAdmin } from "@/lib/admin-authorization.server";\n'
          addition = '''\n\ntype ProductImportRpcClient = {\n  rpc: (\n    fn: "admin_import_product_row_v1",\n    args: Record<string, unknown>,\n  ) => PromiseLike<{ data: { created?: boolean } | null; error: { message?: string } | null }>;\n};\n'''
          if "type ProductImportRpcClient" not in s:
              s = s.replace(marker, marker + addition)
          s = s.replace("(context.supabase as any).rpc", "(context.supabase as unknown as ProductImportRpcClient).rpc")
          p.write_text(s)

          p = Path("src/routes/_authenticated/admin.products.$id.tsx")
          s = p.read_text()
          s = s.replace('product={query.data.product as any}', 'product={query.data.product as Parameters<typeof AdminProductEditor>[0]["product"]}')
          s = s.replace('translations={query.data.translations as any}', 'translations={query.data.translations as Parameters<typeof AdminProductEditor>[0]["translations"]}')
          s = s.replace('variants={query.data.variants as any}', 'variants={query.data.variants as Parameters<typeof AdminProductEditor>[0]["variants"]}')
          s = s.replace('images={query.data.images as any}', 'images={query.data.images as Parameters<typeof AdminProductEditor>[0]["images"]}')
          s = s.replace('categories={query.data.categories as any}', 'categories={query.data.categories as Parameters<typeof AdminProductEditor>[0]["categories"]}')
          p.write_text(s)

          p = Path("src/routes/_authenticated/admin.products.index.tsx")
          s = p.read_text()
          s = s.replace("product: any", "product")
          s = s.replace("item: any", "item")
          p.write_text(s)
          PY
      - name: Autofix changed files
        run: |
          npx eslint --fix \
            scripts/supabase/application-schema-reference-contract.mjs \
            scripts/supabase/generate-application-schema-reference-baseline.mjs \
            scripts/supabase/validate-application-schema-references.mjs \
            scripts/supabase/validate-migration-ownership.mjs \
            src/components/site/AdminProductEditor.tsx \
            src/lib/admin-products-import.functions.ts \
            src/lib/admin-products.functions.ts \
            'src/routes/_authenticated/admin.products.$id.tsx' \
            src/routes/_authenticated/admin.products.import.tsx \
            src/routes/_authenticated/admin.products.index.tsx \
            src/routes/_authenticated/admin.products.new.tsx \
            src/routes/_authenticated/admin.tsx
      - name: Regenerate TanStack route tree through Vite build
        run: npm run build
      - name: Commit deterministic fixes
        run: |
          if git diff --quiet; then
            echo "No autofix changes required"
            exit 0
          fi
          git diff --check
          git config user.name "corner-mex-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/supabase/application-schema-reference-contract.mjs \
            scripts/supabase/generate-application-schema-reference-baseline.mjs \
            scripts/supabase/validate-application-schema-references.mjs \
            scripts/supabase/validate-migration-ownership.mjs \
            src/components/site/AdminProductEditor.tsx \
            src/lib/admin-products-import.functions.ts \
            src/lib/admin-products.functions.ts \
            'src/routes/_authenticated/admin.products.$id.tsx' \
            src/routes/_authenticated/admin.products.import.tsx \
            src/routes/_authenticated/admin.products.index.tsx \
            src/routes/_authenticated/admin.products.new.tsx \
            src/routes/_authenticated/admin.tsx \
            src/routeTree.gen.ts
          git commit -m "fix: harden and format admin product management"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
