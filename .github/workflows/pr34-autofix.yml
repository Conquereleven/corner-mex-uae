name: PR34 Autofix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.number == 34 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Autofix changed TypeScript
        run: |
          npx eslint --fix \
            src/components/site/AdminProductEditor.tsx \
            src/lib/admin-products-import.functions.ts \
            src/lib/admin-products.functions.ts \
            'src/routes/_authenticated/admin.products.$id.tsx' \
            src/routes/_authenticated/admin.products.import.tsx \
            src/routes/_authenticated/admin.products.index.tsx \
            src/routes/_authenticated/admin.products.new.tsx \
            src/routes/_authenticated/admin.tsx || true
      - name: Regenerate TanStack route tree
        run: npm run generate:routes
      - name: Commit deterministic fixes
        run: |
          if git diff --quiet; then
            echo "No autofix changes required"
            exit 0
          fi
          git diff --check
          git config user.name "corner-mex-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/components/site/AdminProductEditor.tsx \
            src/lib/admin-products-import.functions.ts \
            src/lib/admin-products.functions.ts \
            'src/routes/_authenticated/admin.products.$id.tsx' \
            src/routes/_authenticated/admin.products.import.tsx \
            src/routes/_authenticated/admin.products.index.tsx \
            src/routes/_authenticated/admin.products.new.tsx \
            src/routes/_authenticated/admin.tsx \
            src/routeTree.gen.ts
          git commit -m "style: format admin product management and regenerate routes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
